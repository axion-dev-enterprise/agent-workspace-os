<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AXION Motion Studio — Render Service</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-main: #07090f;
        --bg-surface: #0e131f;
        --bg-card: #131b2e;
        --border-color: rgba(90, 150, 240, 0.16);
        --text-main: #f0f4fc;
        --text-muted: #8e9db5;
        --primary: #2982ff;
        --primary-hover: #1f6fe6;
        --accent: #4eb5ff;
        --font-mono: 'JetBrains Mono', Consolas, monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg-main);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      header {
        border-bottom: 1px solid var(--border-color);
        background: rgba(14, 19, 31, 0.85);
        backdrop-filter: blur(12px);
        padding: 16px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand-title {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        letter-spacing: 0.15em;
        font-size: 1.1rem;
      }
      .brand-title svg { width: 22px; height: 22px; fill: var(--primary); }
      .badge {
        font-size: 0.65rem;
        background: rgba(41, 130, 255, 0.15);
        border: 1px solid rgba(41, 130, 255, 0.4);
        color: var(--accent);
        padding: 3px 8px;
        border-radius: 999px;
        font-weight: 600;
        letter-spacing: 0.05em;
      }
      main {
        display: grid;
        grid-template-columns: 440px 1fr;
        gap: 32px;
        padding: 32px;
        max-width: 1600px;
        margin: 0 auto;
        width: 100%;
        flex: 1;
      }
      @media (max-width: 1080px) {
        main { grid-template-columns: 1fr; }
      }

      /* Preview Viewport */
      .viewport-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .film {
        position: relative;
        width: 100%;
        max-width: 360px;
        aspect-ratio: 9 / 16;
        overflow: hidden;
        border-radius: 12px;
        background: radial-gradient(circle at 50% 38%, #10203a 0%, #081020 45%, #04060c 80%);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .film::before {
        content: ""; position: absolute; inset: -25%; pointer-events: none;
        background: conic-gradient(from 140deg at 50% 50%, transparent, #2884ff20, transparent 30%);
        animation: sweep 15s linear infinite;
      }
      .stars {
        position: absolute; inset: 0; opacity: 0.8;
        background-image: radial-gradient(circle, #d0e8ff 1px, transparent 1.6px);
        background-size: 38px 52px;
      }
      .grid {
        position: absolute; width: 180%; height: 80%; left: -40%; bottom: -32%;
        transform: perspective(320px) rotateX(68deg); transform-origin: bottom;
        background-image: linear-gradient(#4da2ff2c 1px, transparent 1px), linear-gradient(90deg, #4da2ff2c 1px, transparent 1px);
        background-size: 36px 36px;
        animation: grid-travel 3.5s linear infinite;
      }
      .core-container {
        position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
        width: 180px; height: 180px; perspective: 800px;
      }
      .gyro-ring {
        position: absolute; inset: 0; border: 2px solid rgba(80, 160, 255, 0.35); border-radius: 50%;
      }
      .ring-1 { transform: rotateX(65deg) rotateY(15deg); animation: spin-r1 15s linear infinite; }
      .ring-2 { inset: 18px; border-color: rgba(140, 200, 255, 0.45); transform: rotateY(70deg) rotateZ(30deg); animation: spin-r2 15s linear infinite; }
      .ring-3 { inset: 36px; border-color: rgba(70, 180, 255, 0.6); transform: rotateX(45deg) rotateZ(60deg); animation: spin-r3 15s linear infinite; }
      .orb {
        position: absolute; left: 50%; top: 50%; width: 62px; aspect-ratio: 1; border-radius: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle at 30% 25%, #ffffff, #6ebcff 18%, #1660bd 52%, #061942 82%);
        box-shadow: 0 0 30px #3296ff, inset -12px -16px 20px #020614;
      }
      .brand-lock {
        position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%);
        text-align: center; letter-spacing: 0.22em; font-weight: 850; font-size: 1.8rem;
      }
      .brand-lock small { display: block; font-size: 0.55rem; color: #9ec2e8; letter-spacing: 0.1em; margin-top: 6px; }

      @keyframes sweep { to { transform: rotate(1turn); } }
      @keyframes grid-travel { to { background-position: 0 36px, 0 36px; } }
      @keyframes spin-r1 { to { transform: rotateX(65deg) rotateY(15deg) rotateZ(1turn); } }
      @keyframes spin-r2 { to { transform: rotateY(70deg) rotateZ(30deg) rotateX(1turn); } }
      @keyframes spin-r3 { to { transform: rotateX(45deg) rotateZ(60deg) rotateY(1turn); } }

      /* Control Dashboard */
      .dashboard {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .card {
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 24px;
      }
      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      .card-title {
        font-size: 1.05rem;
        font-weight: 700;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      label {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      input, select {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 10px 14px;
        color: var(--text-main);
        font: inherit;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.15s;
      }
      input:focus, select:focus {
        border-color: var(--primary);
      }
      .btn {
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px 20px;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: background 0.15s, transform 0.1s;
      }
      .btn:hover { background: var(--primary-hover); }
      .btn:active { transform: scale(0.98); }
      .btn-secondary {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        color: var(--text-main);
      }
      .btn-secondary:hover { background: #1c2742; }

      /* Progress bar */
      .progress-container {
        display: none;
        flex-direction: column;
        gap: 8px;
        margin-top: 16px;
      }
      .progress-bar-bg {
        width: 100%;
        height: 8px;
        background: var(--bg-card);
        border-radius: 999px;
        overflow: hidden;
      }
      .progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--primary), var(--accent));
        width: 0%;
        transition: width 0.2s linear;
      }
      .progress-text {
        font-size: 0.8rem;
        font-family: var(--font-mono);
        color: var(--text-muted);
        display: flex;
        justify-content: space-between;
      }

      /* Video Table */
      .video-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
      }
      .video-table th {
        text-align: left;
        padding: 12px;
        color: var(--text-muted);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-bottom: 1px solid var(--border-color);
      }
      .video-table td {
        padding: 14px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }
      .video-link {
        color: var(--accent);
        text-decoration: none;
        font-family: var(--font-mono);
      }
      .video-link:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand-title">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <span>AXION MOTION STUDIO</span>
        <span class="badge">DAEMON V1.0</span>
      </div>
      <div>
        <span id="service-status" style="font-size: 0.82rem; color: #4ade80;">● Online (127.0.0.1:8150)</span>
      </div>
    </header>

    <main>
      <!-- Interactive Companion Viewport -->
      <section class="viewport-card">
        <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">
          Companion Preview (9:16)
        </div>
        <div class="film">
          <div class="stars"></div>
          <div class="grid"></div>
          <div class="core-container">
            <div class="gyro-ring ring-1"></div>
            <div class="gyro-ring ring-2"></div>
            <div class="gyro-ring ring-3"></div>
            <div class="orb"></div>
          </div>
          <div class="brand-lock">AXION<small>THE AUTONOMOUS OPERATING SYSTEM</small></div>
        </div>
        <button id="toggle-anim" class="btn btn-secondary" style="padding: 6px 14px; font-size: 0.8rem;">Pausar Preview</button>
      </section>

      <!-- Control Center -->
      <section class="dashboard">
        <!-- Render Trigger Card -->
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Novo Render 3D Determinístico</h2>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label>Cena / Storyboard</label>
              <select id="scene-select">
                <option value="autonomous-core">AXION: The Autonomous Core</option>
              </select>
            </div>
            <div class="form-group">
              <label>Resolução</label>
              <select id="res-select">
                <option value="1080x1920">1080×1920 (Vertical 9:16)</option>
                <option value="720x1280">720×1280 (Fast Mobile 9:16)</option>
                <option value="1920x1080">1920×1080 (Widescreen 16:9)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Taxa de Quadros</label>
              <select id="fps-select">
                <option value="30">30 FPS (Padrão)</option>
                <option value="60">60 FPS (Ultra Smooth)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Duração (s)</label>
              <input type="number" id="dur-input" value="15.0" min="2.0" max="60.0" step="0.5" />
            </div>
          </div>

          <div style="margin-top: 20px; display: flex; gap: 12px;">
            <button id="btn-render" class="btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              Iniciar Render Completo
            </button>
            <button id="btn-preview" class="btn btn-secondary">
              Gerar 5 Keyframes
            </button>
          </div>

          <div id="progress-box" class="progress-container">
            <div class="progress-bar-bg">
              <div id="progress-fill" class="progress-bar-fill"></div>
            </div>
            <div class="progress-text">
              <span id="progress-status-msg">Renderizando...</span>
              <span id="progress-pct">0%</span>
            </div>
          </div>
        </div>

        <!-- Rendered Masters List Card -->
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Arquivos Gerados & Masters</h2>
            <button id="btn-refresh" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;">Atualizar</button>
          </div>
          <table class="video-table">
            <thead>
              <tr>
                <th>Arquivo</th>
                <th>Tamanho</th>
                <th>Data</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="video-list-tbody">
              <tr><td colspan="4" style="color: var(--text-muted); text-align: center;">Carregando arquivos...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const film = document.querySelector('.film');
      const toggleBtn = document.getElementById('toggle-anim');
      toggleBtn.addEventListener('click', () => {
        const paused = film.classList.toggle('paused');
        toggleBtn.textContent = paused ? 'Reproduzir Preview' : 'Pausar Preview';
      });

      async function refreshVideos() {
        try {
          const res = await fetch('/videos');
          const videos = await res.json();
          const tbody = document.getElementById('video-list-tbody');
          if (videos.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="color: var(--text-muted); text-align: center;">Nenhum vídeo gerado ainda.</td></tr>';
            return;
          }
          tbody.innerHTML = videos.map(v => `
            <tr>
              <td><strong>${v.name}</strong></td>
              <td>${v.size_mb} MB</td>
              <td>${new Date(v.modified).toLocaleString('pt-BR')}</td>
              <td><a class="video-link" href="/videos/${v.name}" download>Download</a></td>
            </tr>
          `).join('');
        } catch (e) {
          console.error(e);
        }
      }

      document.getElementById('btn-refresh').addEventListener('click', refreshVideos);
      refreshVideos();

      // Trigger Render
      document.getElementById('btn-render').addEventListener('click', async () => {
        const [w, h] = document.getElementById('res-select').value.split('x').map(Number);
        const fps = Number(document.getElementById('fps-select').value);
        const dur = Number(document.getElementById('dur-input').value);
        const scene = document.getElementById('scene-select').value;

        const pBox = document.getElementById('progress-box');
        const pFill = document.getElementById('progress-fill');
        const pMsg = document.getElementById('progress-status-msg');
        const pPct = document.getElementById('progress-pct');
        pBox.style.display = 'flex';

        try {
          const res = await fetch('/render', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ scene_id: scene, width: w, height: h, fps: fps, duration: dur })
          });
          if (!res.ok) {
            const err = await res.json();
            alert('Erro: ' + (err.detail || 'Falha ao iniciar render'));
            return;
          }

          // Polling status
          const poller = setInterval(async () => {
            const sRes = await fetch('/render/status');
            const status = await sRes.json();
            if (status.status === 'rendering') {
              pFill.style.width = status.progress + '%';
              pPct.textContent = status.progress + '%';
              pMsg.textContent = `Frame ${status.current_frame}/${status.total_frames} (${status.elapsed_seconds}s)`;
            } else if (status.status === 'completed') {
              clearInterval(poller);
              pFill.style.width = '100%';
              pPct.textContent = '100%';
              pMsg.textContent = `Concluído em ${status.last_result?.render_seconds || 0}s!`;
              refreshVideos();
            } else if (status.status === 'failed') {
              clearInterval(poller);
              pMsg.textContent = 'Falha: ' + status.error;
            }
          }, 600);
        } catch (e) {
          console.error(e);
          alert('Erro na requisição: ' + e);
        }
      });

      // Preview keyframes
      document.getElementById('btn-preview').addEventListener('click', async () => {
        const [w, h] = document.getElementById('res-select').value.split('x').map(Number);
        const scene = document.getElementById('scene-select').value;
        const btn = document.getElementById('btn-preview');
        btn.textContent = 'Renderizando keyframes...';
        btn.disabled = true;
        try {
          const res = await fetch('/preview', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ scene_id: scene, width: w, height: h })
          });
          const data = await res.json();
          alert(`Gerados com sucesso ${data.frames.length} keyframes em output/!`);
          refreshVideos();
        } catch (e) {
          alert('Erro ao gerar preview: ' + e);
        } finally {
          btn.textContent = 'Gerar 5 Keyframes';
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
