[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-render-service"
version = "1.0.0"
description = "Dedicated 3D Motion Graphics & Procedural Audio Rendering Service for AXION Enterprise"
authors = [
    { name = "AXION DEV", email = "developer@example.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "moderngl>=5.10.0",
    "glcontext>=3.0.0"
]
